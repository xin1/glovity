[project]
name = "telex"
version = "0.3.0"
description = "TeleX SDK: unified session for tracker 6D + glove IMU/joints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "opencv-contrib-python",
  "packaging",
  "pyserial",
  "loguru",
]

[project.optional-dependencies]
docs = [
  "sphinx>=8.0",
  "furo>=2024.8",
  "myst-parser>=2.0",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
]
test = [
  "pytest>=7.0",
]
dev = [
  "hypothesis>=6.0",
  "pre-commit>=3.0",
  "pyright>=1.1",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
telex = "telex.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"telex.tracker" = ["data/*.yml"]
